# ─────────────────────────────────────────────────────────────
# TARGET COMPANIES and the job-board system (ATS) behind their careers page.
#   python -m jobagent detect-ats "<careers page or job URL>"   → snippet to add
#   python -m jobagent verify-companies                         → ✓/✗ per entry
# Formats: greenhouse/lever/ashby/smartrecruiters → slug; workday → site URL;
#          manual → careers URL (add jobs with `add-url`).
# Product/infra companies with Pune or Bangalore engineering (or India-remote).
# ─────────────────────────────────────────────────────────────

